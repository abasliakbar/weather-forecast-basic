<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A clean, modern weather app powered by OpenWeatherMap — check real-time weather conditions for any city worldwide." />
    <title>WeatherNow — Real-Time Weather</title>

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- Dynamic gradient background layer -->
    <div id="bg-gradient" class="bg-gradient" aria-hidden="true"></div>

    <div class="app-wrapper">

      <!-- Decorative ambient blobs -->
      <div class="blob blob-1" aria-hidden="true"></div>
      <div class="blob blob-2" aria-hidden="true"></div>

      <main class="glass-card" role="main">

        <!-- Header -->
        <header class="card-header">
          <div class="logo-mark" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="14" cy="14" r="6" fill="currentColor" opacity="0.9"/>
              <path d="M14 2V5M14 23V26M2 14H5M23 14H26M5.5 5.5L7.6 7.6M20.4 20.4L22.5 22.5M22.5 5.5L20.4 7.6M7.6 20.4L5.5 22.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h1 class="app-title">Weather Forecast</h1>
          <p class="app-subtitle">Real-time conditions, any city</p>
        </header>

        <!-- Search -->
        <section class="search-section" aria-label="City search">
          <div class="search-bar">
            <svg class="search-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
              type="text"
              id="city-input"
              class="city-input"
              placeholder="Search for a city..."
              autocomplete="off"
              aria-label="Enter city name"
              maxlength="80"
            />
            <button id="search-btn" class="search-btn" aria-label="Search weather">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </button>
          </div>
        </section>

        <!-- Geolocation Status Message -->
        <div id="geo-status" class="geo-status hidden" role="status" aria-live="polite">
          <svg class="geo-status-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="geo-message" class="geo-message-text"></span>
        </div>

        <!-- Skeleton Loading State -->
        <div id="loader" class="skeleton-container hidden" aria-live="polite" aria-label="Loading weather data">
          <div class="skeleton-hero">
            <div class="skeleton-icon skeleton-pulse"></div>
            <div class="skeleton-temp-group">
              <div class="skeleton-temp skeleton-pulse"></div>
              <div class="skeleton-desc skeleton-pulse"></div>
            </div>
          </div>
          <div class="skeleton-city skeleton-pulse"></div>
          <div class="skeleton-date skeleton-pulse"></div>
          <div class="skeleton-divider"></div>
          <div class="skeleton-details">
            <div class="skeleton-detail-card skeleton-pulse"></div>
            <div class="skeleton-detail-card skeleton-pulse"></div>
            <div class="skeleton-detail-card skeleton-pulse"></div>
            <div class="skeleton-detail-card skeleton-pulse"></div>
          </div>
          <div class="skeleton-divider"></div>
          <div class="skeleton-forecast-row">
            <div class="skeleton-forecast-card skeleton-pulse"></div>
            <div class="skeleton-forecast-card skeleton-pulse"></div>
            <div class="skeleton-forecast-card skeleton-pulse"></div>
            <div class="skeleton-forecast-card skeleton-pulse"></div>
            <div class="skeleton-forecast-card skeleton-pulse"></div>
          </div>
        </div>

        <!-- Error Message -->
        <div id="error-container" class="error-container hidden" role="alert" aria-live="assertive">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="error-message" class="error-text"></span>
        </div>

        <!-- Weather Display -->
        <section id="weather-container" class="weather-container hidden" aria-label="Weather results" aria-live="polite">

          <!-- Hero: Icon + Temperature -->
          <div class="weather-hero">
            <div id="weather-icon-wrapper" class="icon-wrapper" aria-hidden="true">
              <img id="weather-icon" class="weather-icon" src="" alt="Weather icon" />
            </div>
            <div class="temp-block">
              <span id="temperature" class="temperature"></span>
              <sup class="temp-unit">°C</sup>
            </div>
          </div>

          <!-- Description -->
          <p id="weather-description" class="weather-description"></p>

          <!-- City & Date -->
          <div class="city-row">
            <svg class="location-pin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            <div>
              <h2 id="city-name" class="city-name"></h2>
              <p id="weather-date" class="weather-date"></p>
            </div>
          </div>

          <!-- Divider -->
          <div class="divider" aria-hidden="true"></div>

          <!-- Detail Pills -->
          <div class="details-grid">

            <div class="detail-card" id="detail-humidity">
              <div class="detail-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
              </div>
              <div class="detail-info">
                <span class="detail-label">Humidity</span>
                <span id="humidity" class="detail-value"></span>
              </div>
            </div>

            <div class="detail-card" id="detail-wind">
              <div class="detail-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
                </svg>
              </div>
              <div class="detail-info">
                <span class="detail-label">Wind Speed</span>
                <span id="wind-speed" class="detail-value"></span>
              </div>
            </div>

            <div class="detail-card" id="detail-feels">
              <div class="detail-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
                </svg>
              </div>
              <div class="detail-info">
                <span class="detail-label">Feels Like</span>
                <span id="feels-like" class="detail-value"></span>
              </div>
            </div>

            <div class="detail-card" id="detail-visibility">
              <div class="detail-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </div>
              <div class="detail-info">
                <span class="detail-label">Visibility</span>
                <span id="visibility" class="detail-value"></span>
              </div>
            </div>

          </div>

          <!-- Divider before forecast -->
          <div class="divider divider-forecast" aria-hidden="true"></div>

          <!-- Hourly Forecast -->
          <div id="forecast-container" class="forecast-container hidden" aria-label="Hourly forecast">
            <h3 class="forecast-title">Forecast</h3>
            <div id="forecast-scroll" class="forecast-scroll"></div>
          </div>

        </section>

      </main>

      <footer class="app-footer">
        <p>Powered by <a href="https://openweathermap.org" target="_blank" rel="noopener noreferrer">OpenWeatherMap</a></p>
      </footer>

    </div>

    <script src="app.js"></script>
  </body>
</html>
